# nginx site for AlmaStudio — HTTPS (final config)
# Install with deploy/setup-https.sh (it gets the certificate first, then installs this file).
#
# DNS: alma.artepersia.com → 78.39.51.105
# App: docker compose on 127.0.0.1:3000

# ---- HTTP: only for Let's Encrypt renewals, everything else → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name alma.artepersia.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # "ssl http2" works on old (Ubuntu 22.04 = 1.18) and new nginx alike
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alma.artepersia.com;

    ssl_certificate     /etc/letsencrypt/live/alma.artepersia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alma.artepersia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers remember "HTTPS only" for 6 months (no includeSubDomains: other
    # artepersia.com subdomains are not affected)
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Photos straight from the camera can be big; the admin panel shrinks
    # them before upload, this is the hard ceiling (app limit: 25 MB)
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build assets have hashed names → cache for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
