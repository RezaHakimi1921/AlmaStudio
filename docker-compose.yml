# Production compose — alma.artepersia.com → 78.39.51.105
# Edge TLS: PersonalWallet Caddy on personalwallet_default (no host port publish).
# Put secrets in `.env` next to this file (see .env.example).

name: alma-studio

services:
  alma:
    build: .
    image: alma-studio:latest
    container_name: alma-studio
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-alma123}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me-in-production}
    volumes:
      - alma_data:/app/data
      - alma_uploads:/app/public/uploads
    networks:
      edge:
        aliases: [alma-studio]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-personalwallet_default}

volumes:
  alma_data:
  alma_uploads:
