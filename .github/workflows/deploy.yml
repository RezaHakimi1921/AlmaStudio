# Deploy to the production server — only after a human approves it on GitHub.
#
# Every push to `main` creates a run that waits at the «production» environment.
# The reviewer opens the run → "Review deployments" → Approve, and only then the
# self-hosted runner on the server executes deploy/auto-deploy.sh (backup → build →
# health check → automatic rollback if the new version does not become healthy).
#
# One-time setup (GitHub settings + runner): see deploy/DEPLOY.md → "Deploy with approval".
name: Deploy (needs approval)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".cursor/**"
      - "demo-screenshots*/**"
  workflow_dispatch: # «Run workflow» button — redeploy any time, also needs approval

# never two deploys at once; a newer pending run replaces an older unapproved one
concurrency:
  group: alma-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to alma.artepersia.com
    runs-on: [self-hosted, alma]
    timeout-minutes: 25
    # ⏸ required reviewers are configured on this environment (Settings → Environments)
    environment:
      name: production
      url: https://alma.artepersia.com
    env:
      APP_DIR: /home/cluadai/alma-studio
      FORCE_RETRY: "1" # an approved re-run also retries a commit that was rolled back before
    steps:
      - name: Deploy latest main (backup → build → health check → auto rollback)
        run: sudo -n --preserve-env=FORCE_RETRY bash "$APP_DIR/deploy/auto-deploy.sh"

      - name: Show deployed version and last log lines
        if: always()
        run: sudo -n bash "$APP_DIR/deploy/auto-deploy.sh" --status
